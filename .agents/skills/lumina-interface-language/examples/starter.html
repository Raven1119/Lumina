<!doctype html><html lang="zh-CN" class="lui" data-lui-theme="mineral"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lumina · 起步样本</title><link rel="stylesheet" href="../assets/tokens.css"><link rel="stylesheet" href="../assets/primitives.css"></head><body class="lui-body"><main class="lui-wrap"><header class="lui-header"><span class="lui-wordmark">LUMINA</span><nav class="lui-theme-bar" aria-label="选择主题"><button class="lui-theme cursor-target" data-lui-theme-choice="mineral" aria-pressed="true">矿灰</button><button class="lui-theme cursor-target" data-lui-theme-choice="depth" aria-pressed="false">幽青</button><button class="lui-theme cursor-target" data-lui-theme-choice="stone" aria-pressed="false">岩灰</button></nav></header><h1 class="lui-title">在这里，继续。</h1><p class="lui-body-text lui-muted">这是可接入项目的样式起点。保留真实业务结构，使用统一的色彩、文字与材料层次。</p><section class="lui-panel lui-stack"><label class="lui-label" for="draft">本地草稿</label><textarea class="lui-input" id="draft" rows="7" placeholder="先感受正文、边界与输入状态。"></textarea><div class="lui-row"><button class="lui-btn primary" id="save">保存到本浏览器</button><button class="lui-btn" id="clear">清除草稿</button></div><p class="lui-note" id="status" role="status">只有点击保存时才写入本浏览器，不上传。</p></section><hr class="lui-rule"><p class="lui-note">基础样式不加载第三方动效。完整动作及精确移植入口在 <a class="lui-link" href="../assets/motion-reference.html">动效验收页</a>。</p><a class="lui-link" href="../START.html">返回设计资产入口 ↗</a></main><script src="../assets/theme.js"></script><script>
LuminaTheme.bind(document.documentElement);const key='lumina-language-v1-starter',draft=document.getElementById('draft'),status=document.getElementById('status');try{draft.value=localStorage.getItem(key)||'';}catch{}
document.getElementById('save').onclick=()=>{try{localStorage.setItem(key,draft.value);status.textContent='已保存到此浏览器。';}catch{status.textContent='此浏览器未允许保存；草稿仍在本页，请复制保留。';}};document.getElementById('clear').onclick=()=>{draft.value='';try{localStorage.removeItem(key);status.textContent='本地草稿已清除。';}catch{status.textContent='本页已清空；无法访问浏览器存储。';}};
</script></body></html>
